# ==========================================================================
# organization.toml — Alucastor Organization Identity [SITE LAYER]
# ==========================================================================
# Feeds Organization, ManufacturingBusiness and WebSite JSON-LD.
# Brand identity (legalName, logo, url, address, geo, sameAs) lives in
# config/branding/schema.toml. This file holds ONLY the multilingual
# marketing text rendered at the Organization level.
# ==========================================================================

# --- Global contact point (language-neutral) ---
[contact_point]
contact_type = "sales"
email = "hank@alucastor.com"
available_language = ["English", "German", "Japanese", "French", "Spanish", "Chinese"]

# --- Multilingual site metadata (language-neutral lists) ---
[multilingual]
in_language = ["en", "de", "ja", "fr", "es"]
available_language = ["en", "de", "ja", "fr", "es"]


# ==========================================================================
# LOCALIZED ORGANIZATION TEXT
# ==========================================================================

[en]
name = "Alucastor"
description = "Alucastor is an aluminum casting manufacturer in China specialising in gravity die casting, aluminum sand casting, low pressure die casting, precision CNC machining and rapid prototyping for automotive, aerospace, electronics, robotics and new energy customers worldwide."
keywords = [
  "Aluminum Casting Manufacturer China",
  "Gravity Die Casting",
  "Aluminum Sand Casting",
  "Low Pressure Die Casting",
  "Precision CNC Machining",
  "Rapid Prototyping",
  "ADC12 Aluminum Casting",
  "A380 Aluminum Casting"
]
site_title = "Alucastor — Aluminum Casting Manufacturer China"
slogan = "Aluminum Casting Manufacturer in China — Gravity, Sand & Low Pressure Casting with In-House CNC Machining"

