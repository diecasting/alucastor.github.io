# ENGLISH (en) — full localized industry content
# ==========================================================================

[en.automotive]
name = "Automotive"
description = "Lightweight aluminum castings and machined components for powertrain, chassis and thermal systems, produced under IATF 16949 process discipline with PPAP documentation."
applications = [
  "Engine and transmission housings",
  "Suspension knuckles and control arm brackets",
  "Alloy wheels and hub carriers",
  "Oil pans, water pump and thermostat housings",
  "Turbocharger and intake manifold components",
  "Structural body and crash-relevant brackets"
]

[en.aerospace]
name = "Aerospace"
description = "High-integrity aluminum castings and precision machined fittings for airframe, UAV and ground support equipment, supported by NDT inspection and full material traceability."
applications = [
  "Airframe structural fittings and brackets",
  "UAV and drone frame components",
  "Actuator and landing gear housings",
  "Avionics enclosures and cold plates",
  "Ground support equipment castings",
  "Satellite and payload mounting structures"
]

[en.electronics]
name = "Electronics"
description = "Thermally efficient aluminum housings, heat sinks and EMI-shielding enclosures for telecom, computing and power electronics, machined and finished to appearance-critical standards."
applications = [
  "5G base station and RF filter housings",
  "LED lighting heat sinks",
  "Power inverter and converter enclosures",
  "Server and networking equipment chassis",
  "EMI/RFI shielding covers",
  "Connector shells and instrument frames"
]

[en.industrial-equipment]
name = "Industrial Equipment"
description = "Large and medium aluminum castings for machinery builders — pump bodies, gearbox casings, compressor housings and structural frames delivered as finished, machined assemblies."
applications = [
  "Pump housings and impeller bodies",
  "Gearbox and reducer casings",
  "Compressor and blower housings",
  "Hydraulic manifold and valve blocks",
  "Machine tool frames and slide plates",
  "Conveyor and material handling components"
]

[en.robotics]
name = "Robotics"
description = "Precision aluminum structural parts for industrial robots, cobots and automation cells, where low inertia, tight tolerances and repeatable stiffness are decisive."
applications = [
  "Robotic arm links and joint housings",
  "Harmonic drive and gearbox mounting plates",
  "End effector and gripper bodies",
  "AGV and AMR chassis components",
  "Linear axis carriages and brackets",
  "Automation cell fixture plates"
]

[en.new-energy]
name = "New Energy"
description = "Aluminum casting and machining for EV, battery, solar and wind applications, focused on thermal performance, pressure tightness and lightweight structural integrity."
applications = [
  "EV battery enclosures and cooling plates",
  "Electric motor and inverter housings",
  "Charging pile and power module heat sinks",
  "Solar tracker and mounting brackets",
  "Wind turbine auxiliary castings",
  "Energy storage system frames"
]

[en.consumer-products]
name = "Consumer Products"
description = "Appearance-critical aluminum components for premium consumer goods, kitchen equipment, power tools and outdoor products, finished by anodizing, polishing or powder coating."
applications = [
  "Power tool bodies and gear housings",
  "Premium kitchen and cookware components",
  "Outdoor and sporting equipment hardware",
  "Furniture and architectural fittings",
  "Audio and camera equipment enclosures",
  "Personal mobility and e-bike parts"
]


