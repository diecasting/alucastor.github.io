# ==========================================================================
# industries.toml — Alucastor Industry Entity Layer [SITE LAYER]
# ==========================================================================
# Seven industry entities served by Alucastor:
#
#   1. automotive            5. robotics
#   2. aerospace             6. new-energy
#   3. electronics           7. consumer-products
#   4. industrial-equipment
#
# Feeds:
#   - Industry JSON-LD on /industries/<id>/ pages (schema/industry.html)
#   - areaServed in Service JSON-LD          (schema/service.html)
#   - ItemList "Industries Served" on home   (schema/geo-entity.html)
#   - Homepage industries section            (sections/industries.html)
#
# CONTRACT (do not change):
#   [[industries]]  language-neutral entity -> id / sort_order / url_path
#   [<lang>.<id>]   localized text          -> name / description / applications
#
# Entity relationships (language-neutral):
#   related_services -> ids in data/schema/services.toml
# ==========================================================================


