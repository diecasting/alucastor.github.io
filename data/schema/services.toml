  "Porosity level 1 – 2 (ASTM E505)",
  "Mechanical properties after T6: tensile 280 – 320 MPa",
  "Elongation up to 8 – 12 %",
  "Linear tolerance to CT6 – CT7 (ISO 8062)",
  "Fully weldable and heat-treatable castings",
  "Automated cells for repeatable process control"
