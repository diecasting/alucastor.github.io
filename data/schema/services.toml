[en.gravity-die-casting]
name = "Gravity Die Casting"
description = "Gravity die casting of aluminum components in reusable steel permanent molds, producing dense, pressure-tight parts with excellent mechanical properties and full heat-treat capability."
manufacturing_process = [
  "DFM review and casting simulation of the customer 3D model",
  "H13 steel permanent mold design and CNC tooling manufacture",
  "Charge melting, degassing and grain refinement of the aluminum alloy",
  "Mold preheating and refractory coating application",
  "Static or tilt gravity pouring under controlled melt temperature",
  "Directional solidification and controlled mold cooling",
  "Shakeout, gate and riser removal, shot blasting",
  "T5 / T6 heat treatment and straightening",
  "CNC machining of functional surfaces",
  "Leak testing, dimensional inspection and packing"
]
applications = [
  "Automotive engine and transmission housings",
  "EV battery cooling plates and inverter housings",
  "Hydraulic and pneumatic valve bodies",
  "LED and industrial lighting heat sinks",
  "Pump housings and impeller bodies",
  "Robotic arm structural brackets"
]
capabilities = [
  "Part weight range 0.05 kg – 60 kg",
  "Wall thickness from 3.0 mm",
  "Linear tolerance to CT6 – CT8 (ISO 8062)",
  "As-cast surface roughness Ra 6.3 – 12.5 µm",
  "Machined tolerance to ±0.02 mm",
  "Tooling life 80,000 – 120,000 shots",
  "Pressure tightness tested to 6 bar",
  "Annual capacity 3,000+ tons"
]

[en.sand-casting]
name = "Sand Casting"
description = "Aluminum sand casting for large, complex and low-to-medium volume components, using resin sand, green sand and 3D printed sand molds with no hard tooling investment."
manufacturing_process = [
  "Pattern design review and methoding simulation",
  "Wood, resin or 3D printed pattern and core box production",
  "Green sand or resin (furan) sand mold preparation",
  "Core making, core setting and mold assembly",
  "Aluminum melting, degassing and spectrometer verification",
  "Gravity pouring into the sand mold",
  "Cooling, shakeout and sand reclamation",
  "Gate cut-off, grinding and shot blasting",
  "Heat treatment (T6) where specified",
  "CNC machining, X-ray / dye penetrant inspection and packing"
]
applications = [
  "Large industrial machine housings and frames",
  "Wind and solar power equipment brackets",
  "Compressor and gearbox casings",
  "Agricultural and construction machinery parts",
  "Pump bodies and manifold blocks",
  "Prototype and low-volume structural castings"
]
capabilities = [
  "Part weight range 0.5 kg – 500 kg",
  "Maximum casting envelope 2,000 × 1,500 × 800 mm",
  "Wall thickness from 4.0 mm",
  "Linear tolerance to CT8 – CT11 (ISO 8062)",
  "Sample lead time 10 – 15 days with no hard tooling",
  "3D printed sand molds for zero-tooling prototypes",
  "X-ray and dye penetrant NDT available",
  "Economical from 1 piece to 5,000 pieces per year"
]

[en.low-pressure-die-casting]
name = "Low Pressure Die Casting"
description = "Low pressure die casting that fills the die from below under controlled gas pressure, delivering high-integrity, low-porosity aluminum parts suitable for T6 heat treatment and structural loading."
manufacturing_process = [
  "Casting feasibility study and filling / solidification simulation",
  "Low pressure die design with riser tube and thermal management",
  "H13 die manufacture, fitting and trial",
  "Melt preparation, degassing and holding in the sealed furnace",
  "Controlled low pressure filling (0.02 – 0.08 MPa) through the riser tube",
  "Pressure held during directional solidification",
  "Die opening, part extraction and automated trimming",
  "T6 solution treatment, quenching and artificial ageing",
  "CNC machining of sealing and mounting faces",
  "Helium / air leak testing, CMM inspection and packing"
]
applications = [
  "Automotive alloy wheels and suspension knuckles",
  "EV battery enclosures and motor housings",
  "Cylinder heads and intake manifolds",
  "Aerospace and UAV structural brackets",
  "High-integrity pressure vessels and valve bodies",
