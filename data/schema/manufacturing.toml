  "Gravity Die Casting Cells",
  "Low Pressure Die Casting Machines",
  "Resin Sand Molding Line",
  "3D Sand Printing",
  "Aluminum Melting & Degassing Furnaces",
  "T6 Heat Treatment Furnaces",
  "3/4/5-Axis CNC Machining Centres",
  "CNC Turning Centres",
  "Zeiss CMM & Spectrometer",
  "X-Ray and Dye Penetrant NDT",
