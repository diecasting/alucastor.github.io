# ==========================================================================
# products.toml — Alucastor Material Entity Layer [SITE LAYER]
# ==========================================================================
# This file is the template's "Product Categories & Material Specifications"
# layer. Alucastor uses it as the ALUMINUM MATERIAL entity layer, so material
# pages are emitted as Product JSON-LD by the existing schema engine
# (layouts/partials/schema/product.html) with no new schema system.
#
#   1. aluminum-alloy           — Aluminum Alloy (family entity)
#   2. adc12-aluminum           — ADC12 Aluminum
#   3. a380-aluminum            — A380 Aluminum
#   4. aluminum-silicon-alloy   — Aluminum Silicon Alloy
#   5. 6061-aluminum            — 6061 Aluminum
#   6. 7075-aluminum            — 7075 Aluminum
#
# CONTRACT (do not change):
#   [[products]]   language-neutral entity -> id / category / url_path
#                  `url_path` MUST equal the content directory path.
#   [<lang>.<id>]  localized entity text   -> name / description /
#                                             key_properties / properties /
#                                             applications
#
# Entity relationships (language-neutral):
#   related_services -> ids in data/schema/services.toml
# ==========================================================================


# ==========================================================================
# MATERIAL CATALOG — language-neutral entity definitions
# ==========================================================================

