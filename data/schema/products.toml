# ENGLISH (en) — full localized material content
# ==========================================================================

[en.aluminum-alloy]
name = "Aluminum Alloy"
description = "The complete family of casting and wrought aluminum alloys Alucastor processes in-house, selected per application for strength, castability, corrosion resistance, thermal conductivity and machinability."
key_properties = "Density 2.66 – 2.81 g/cm³, tensile strength 150 – 570 MPa, excellent corrosion resistance, high thermal and electrical conductivity, fully recyclable"
properties = [
  "Density: 2.66 – 2.81 g/cm³ (roughly one third of steel)",
  "Tensile strength: 150 – 570 MPa depending on alloy and temper",
  "Thermal conductivity: 96 – 167 W/m·K",
  "Excellent natural corrosion resistance via passive oxide layer",
  "Non-magnetic and non-sparking",
  "100 % recyclable at approximately 5 % of primary energy cost"
]
applications = [
  "Structural and load-bearing castings",
  "Thermal management and heat sink components",
  "Lightweight automotive and EV assemblies",
  "Electronic and telecom enclosures",
  "Industrial machinery housings"
]

[en.adc12-aluminum]
name = "ADC12 Aluminum"
description = "ADC12 is the most widely specified aluminum die casting alloy — an Al-Si-Cu alloy offering outstanding castability, dimensional stability and cost efficiency for thin-wall, high-volume components."
key_properties = "Si 9.6–12.0 %, Cu 1.5–3.5 %, tensile strength 228–310 MPa, hardness 80–90 HB, excellent fluidity and thin-wall filling"
properties = [
  "Chemical composition: Si 9.6 – 12.0 %, Cu 1.5 – 3.5 %, Fe ≤ 1.3 %",
  "Tensile strength: 228 – 310 MPa",
  "Yield strength: 150 – 170 MPa",
  "Brinell hardness: 80 – 90 HB",
  "Melting range: 515 – 582 °C",
  "Excellent fluidity — supports wall thickness down to 1.0 mm",
  "Good machinability and dimensional stability",
  "Not recommended for T6 heat treatment (copper content)"
]
applications = [
  "Automotive engine and transmission covers",
  "Electronic housings and connector shells",
  "Power tool and appliance bodies",
  "Telecom heat sinks and RF enclosures",
  "Thin-wall structural brackets"
]

[en.a380-aluminum]
name = "A380 Aluminum"
description = "A380 is a general-purpose Al-Si-Cu casting alloy combining strength, pressure tightness and thermal stability — the industry workhorse for structural housings that must perform at elevated temperature."
key_properties = "Si 7.5–9.5 %, Cu 3.0–4.0 %, tensile strength 315–330 MPa, hardness 80 HB, excellent pressure tightness and elevated-temperature strength"
properties = [
  "Chemical composition: Si 7.5 – 9.5 %, Cu 3.0 – 4.0 %, Fe ≤ 1.3 %",
  "Tensile strength: 315 – 330 MPa",
  "Yield strength: 160 – 165 MPa",
  "Elongation: 3 – 4 %",
  "Brinell hardness: approximately 80 HB",
  "Melting range: 540 – 595 °C",
  "Excellent pressure tightness for fluid-carrying parts",
  "Retains strength at elevated service temperature"
]
applications = [
  "Gearbox and transmission housings",
  "Hydraulic and pneumatic valve bodies",
  "Engine brackets and mounting plates",
  "Pump casings and manifold blocks",
  "Industrial equipment frames"
]

[en.aluminum-silicon-alloy]
name = "Aluminum Silicon Alloy"
description = "Hypoeutectic Al-Si alloys such as AlSi7Mg, AlSi10Mg and A356 deliver the best combination of castability, weldability and post-cast mechanical properties, and respond exceptionally well to T6 heat treatment."
key_properties = "Si 6.5–12.0 %, Mg 0.25–0.45 %, tensile strength after T6 up to 320 MPa, elongation up to 12 %, fully weldable and heat-treatable"
properties = [
  "Chemical composition: Si 6.5 – 12.0 %, Mg 0.25 – 0.45 %, low Cu",
  "As-cast tensile strength: 160 – 200 MPa",
  "T6 tensile strength: 280 – 320 MPa",
  "T6 elongation: 8 – 12 %",
  "Outstanding fluidity and low shrinkage porosity",
  "Fully weldable — suitable for fabricated assemblies",
  "Superior corrosion resistance versus copper-bearing alloys",
  "Preferred alloy family for low pressure die casting"
]
applications = [
  "Automotive alloy wheels and suspension parts",
  "EV battery enclosures and motor housings",
  "Cylinder heads and intake manifolds",
  "Aerospace and UAV structural castings",
  "Safety-critical load-bearing components"
]

[en."6061-aluminum"]
name = "6061 Aluminum"
description = "6061 is the most versatile wrought aluminum alloy for machined parts — an Al-Mg-Si alloy with an excellent balance of strength, weldability, corrosion resistance and anodizing quality."
key_properties = "Tensile strength 310 MPa (T6), yield 276 MPa, hardness 95 HB, excellent machinability, weldability and anodizing response"
properties = [
  "Chemical composition: Mg 0.8 – 1.2 %, Si 0.4 – 0.8 %, Cu 0.15 – 0.40 %",
  "Tensile strength (T6): 310 MPa",
  "Yield strength (T6): 276 MPa",
  "Elongation: 12 – 17 %",
  "Brinell hardness: approximately 95 HB",
  "Excellent machinability with clean chip breaking",
  "Readily weldable by TIG and MIG",
  "Uniform, high-quality anodized finish"
]
applications = [
  "CNC machined prototypes and production parts",
  "Robotic frames, plates and brackets",
  "Electronic and instrument enclosures",
  "Optical and semiconductor equipment parts",
  "Marine and architectural hardware"
]

[en."7075-aluminum"]
name = "7075 Aluminum"
description = "7075 is a high-strength Al-Zn-Mg-Cu aerospace alloy with a strength-to-weight ratio comparable to many steels, specified for highly stressed structural components and precision tooling."
key_properties = "Tensile strength 572 MPa (T6), yield 503 MPa, hardness 150 HB, highest strength-to-weight ratio of common aluminum alloys"
properties = [
  "Chemical composition: Zn 5.1 – 6.1 %, Mg 2.1 – 2.9 %, Cu 1.2 – 2.0 %",
  "Tensile strength (T6): 572 MPa",
  "Yield strength (T6): 503 MPa",
  "Elongation: 5 – 11 %",
  "Brinell hardness: approximately 150 HB",
  "Excellent fatigue strength for cyclic loading",
  "Good machinability with excellent surface finish",
  "Limited weldability — mechanical fastening preferred"
]
applications = [
  "Aerospace structural fittings and airframe parts",
  "High-load robotic and automation components",
  "Motorsport and performance vehicle parts",
  "Precision jigs, fixtures and mold plates",
  "Defence and high-stress industrial hardware"
]


