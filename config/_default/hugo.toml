# ==========================================================================# hugo.toml — Alucastor (Multilingual Configuration)# ==========================================================================# Base content language: English (en) at site root.# Secondary languages served under language prefixes: /de/ /ja/ /fr/ /es/# All branding lives in config/branding/*.toml -> config/_default/params.toml.# ==========================================================================baseURL = "https://blog.alucastor.com/"locale = "en-US"title = "Alucastor"defaultContentLanguage = "en"defaultContentLanguageInSubdir = falseenableRobotsTXT = trueenableGitInfo = trueenableMissingTranslationPlaceholders = false# Paginationpaginate = 12# Output formats — HTML + RSS (home/section) + HTML (page).# Hugo generates /sitemap.xml (all languages) automatically.[outputs]  home = ["HTML", "RSS"]  section = ["HTML", "RSS"]  page = ["HTML"]# Taxonomies[taxonomies]  category = "categories"  tag = "tags"# Sitemap defaults[sitemap]  changefreq = "weekly"  filename = "sitemap.xml"  priority = 0.6# Minify configuration[minify]  minifyOutput = true  [minify.tdewolff]    [minify.tdewolff.html]      keepComments = false    [minify.tdewolff.css]      precision = 0    [minify.tdewolff.js]      precision = 0# Markup configuration[markup]  [markup.goldmark]    [markup.goldmark.renderer]      unsafe = true    [markup.goldmark.parser]      autoHeadingID = true      autoHeadingIDType = "github"  [markup.highlight]    style = "github"    lineNos = false    noClasses = true  [markup.tableOfContents]    startLevel = 2    endLevel = 4# RSS service limits[services]  [services.rss]    limit = 10