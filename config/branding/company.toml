# ==========================================================================
# company.toml — Brand Identity (Alucastor)
# ==========================================================================
# SINGLE SOURCE OF TRUTH for brand identity.
# Merged into config/_default/params.toml by scripts/sync-branding.py.
# Templates read these values as .Site.Params.company.*
# ==========================================================================

[params]
[params.company]
  name = "Alucastor"
  tagline = "Aluminum Casting Manufacturer in China"
  # Short company descriptor shown in the footer brand column.
  footer_description = "Precision metal manufacturing solutions for global industrial customers."

  [params.company.branding]
    # Absolute or root-relative logo URL (PNG/SVG). Empty = text wordmark.
    logo = ""
    # 1-3 letter monogram shown in the header logo mark.
    logo_mark = "AL"
    # Small text under the wordmark. Empty = company.tagline.
    logo_subtitle = "Aluminum Casting Manufacturer"
